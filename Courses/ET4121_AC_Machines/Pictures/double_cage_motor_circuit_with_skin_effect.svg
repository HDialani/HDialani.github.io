   font-size="18px"
   id="tspan15">1</tspan></text>
    <!-- R1 -->
    <text
       x="132.86845"
       y="60.760693"
       font-size="22px"
       id="text16">R<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan16">1</tspan></text>
    <!-- X1 -->
    <text
       x="257.86847"
       y="60.760693"
       font-size="22px"
       id="text17">X<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan17">1</tspan></text>
    <!-- X2' = 2πf1L2'  (centered above X2' inductor) -->
    <text
       x="461.66086"
       y="37.812992"
       font-size="20px"
       text-anchor="middle"
       id="text21">X'<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan18">2</tspan><tspan
   font-style="normal"
   id="tspan19">= 2π</tspan>f<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan20">1</tspan>L'<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan21">2</tspan></text>
    <!-- X2'' = 2πf1L2''  (centered above X2'' inductor) -->
    <text
       x="663.24567"
       y="36.228207"
       font-size="20px"
       text-anchor="middle"
       id="text25">X''<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan22">2</tspan><tspan
   font-style="normal"
   id="tspan23">= 2π</tspan>f<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan24">1</tspan>L''<tspan
   baseline-shift="sub"
   font-size="14px"
   id="tspan25">2</tspan></text>
    <!-- Xm (left of vertical coil) -->
    <text
       x="322.86847"
       y="150.7607"
       font-size="22px"
       id="text26">X<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan26">m</tspan></text>
    <!-- E1 (right of vertical coil) -->
    <text
       x="392.86847"
       y="150.7607"
       font-size="22px"
       id="text27">E<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan27">1</tspan></text>
    <!-- R2'/s fraction (right of first vertical resistor) -->
    <text
       x="597.86847"
       y="140.7607"
       font-size="22px"
       id="text28">R'<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan28">2</tspan></text>
    <line
       x1="597.86847"
       y1="148.7607"
       x2="634.86847"
       y2="148.7607"
       stroke="#000000"
       stroke-width="1.5"
       id="line28" />
    <text
       x="610.86847"
       y="170.7607"
       font-size="22px"
       id="text29">s</text>
    <!-- R2''/s fraction (right of second vertical resistor) -->
    <text
       x="817.86847"
       y="140.7607"
       font-size="22px"
       id="text30">R''<tspan
   baseline-shift="sub"
   font-size="15px"
   id="tspan29">2</tspan></text>
    <line
       x1="817.86847"
       y1="148.7607"
       x2="858.86847"
       y2="148.7607"
       stroke="#000000"
       stroke-width="1.5"
       id="line30" />
    <text
       x="832.86847"
