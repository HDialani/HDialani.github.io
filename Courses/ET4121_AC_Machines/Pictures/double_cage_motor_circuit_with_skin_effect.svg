  <title
     id="title1">Induction Motor Double-Cage Equivalent Circuit</title>
  <desc
     id="desc1">Per-phase equivalent circuit with two rotor branches</desc>
  <sodipodi0:namedview
     inkscape:current-layer="labels"
     inkscape:zoom="1"
     inkscape:cx="500"
     inkscape:cy="200"
     pagecolor="#ffffff"
     bordercolor="#666666"
     showgrid="false" />
  <!-- ================= WIRES / COMPONENTS ================= -->
  <g
     inkscape:groupmode="layer"
     inkscape:label="Circuit"
     stroke="#000000"
     stroke-width="2"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="g15">
    <!-- Left terminals -->
    <circle
       cx="42.868462"
       cy="15.760697"
       r="5"
       id="circle1" />
    <circle
       cx="42.868462"
       cy="235.7607"
       r="5"
       id="circle2" />
    <!-- Top wire: terminal -> R1 -->
    <line
       x1="47.868462"
       y1="15.760697"
       x2="97.868462"
       y2="15.760697"
       id="line2" />
    <!-- R1 resistor (zigzag) -->
    <polyline
       points="105,95 113,83 129,107 145,83 161,107 177,83 193,107 201,95"
       id="polyline2"
       transform="translate(-7.1315369,-79.239302)" />
    <!-- Wire R1 -> X1 -->
    <line
       x1="193.86845"
       y1="15.760697"
       x2="222.86845"
       y2="15.760697"
       id="line3" />
    <!-- X1 inductor (4 bumps) -->
    <path
       d="m 222.86846,15.760698 a 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0"
       id="path3" />
    <!-- Wire X1 -> junction A -->
    <line
       x1="318.86847"
       y1="15.760697"
       x2="372.86847"
       y2="15.760697"
       id="line4" />
    <!-- Junction A (top of Xm branch) -->
    <circle
       cx="372.86847"
       cy="15.760697"
       r="4"
       fill="#000000"
       stroke="none"
       id="circle4" />
    <!-- Wire junction A -> X2' -->
    <line
       x1="372.86847"
       y1="15.760697"
       x2="412.86847"
       y2="15.760697"
       id="line5" />
    <!-- X2' inductor -->
    <path
       d="m 412.86846,15.760698 a 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0"
       id="path5" />
    <!-- Wire X2' -> junction B -->
    <line
       x1="508.86847"
       y1="15.760697"
       x2="572.86847"
       y2="15.760697"
       id="line6" />
    <!-- Junction B (top of R2'/s branch) -->
    <circle
       cx="572.86847"
       cy="15.760697"
       r="4"
       fill="#000000"
       stroke="none"
       id="circle6" />
    <!-- Wire junction B -> X2'' -->
    <line
       x1="572.86847"
       y1="15.760697"
       x2="612.86847"
       y2="15.760697"
       id="line7" />
    <!-- X2'' inductor -->
    <path
       d="m 612.86846,15.760698 a 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0 12,12 0 0 1 24,0"
       id="path7" />
    <!-- Wire X2'' -> top-right corner -->
    <line
       x1="708.86847"
       y1="15.760697"
       x2="792.86847"
       y2="15.760697"
       id="line8" />
    <!-- Right vertical wire down to R2''/s -->
    <line
       x1="792.86847"
       y1="15.760697"
       x2="792.86847"
       y2="100.7607"
       id="line9" />
    <!-- R2''/s vertical resistor -->
    <polyline
       points="800,180 788,188 812,204 788,220 812,236 788,252 812,268 800,276"
       id="polyline9"
       transform="translate(-7.1315369,-79.239302)" />
    <!-- Wire R2''/s -> bottom -->
    <line
       x1="792.86847"
       y1="196.7607"
       x2="792.86847"
       y2="235.7607"
       id="line10" />
    <!-- Middle branch 1: junction A -> Xm -->
    <line
       x1="372.86847"
       y1="15.760697"
       x2="372.86847"
       y2="100.7607"
       id="line11" />
    <!-- Xm inductor (vertical, bumps to the left) -->
    <path
       d="m 372.86846,100.7607 a 12,12 0 0 0 0,24 12,12 0 0 0 0,24 12,12 0 0 0 0,24 12,12 0 0 0 0,24"
       id="path11" />
    <!-- Wire Xm -> bottom junction -->
    <line
       x1="372.86847"
       y1="196.7607"
       x2="372.86847"
       y2="235.7607"
       id="line12" />
    <!-- Bottom junction dot (Xm) -->
    <circle
       cx="372.86847"
       cy="235.7607"
       r="4"
       fill="#000000"
       stroke="none"
       id="circle12" />
    <!-- Middle branch 2: junction B -> R2'/s -->
    <line
       x1="572.86847"
       y1="15.760697"
       x2="572.86847"
       y2="100.7607"
       id="line13" />
    <!-- R2'/s vertical resistor -->
    <polyline
       points="580,180 568,188 592,204 568,220 592,236 568,252 592,268 580,276"
       id="polyline13"
       transform="translate(-7.1315369,-79.239302)" />
    <!-- Wire R2'/s -> bottom junction -->
    <line
       x1="572.86847"
       y1="196.7607"
       x2="572.86847"
       y2="235.7607"
       id="line14" />
    <!-- Bottom junction dot (R2'/s) -->
    <circle
       cx="572.86847"
       cy="235.7607"
       r="4"
       fill="#000000"
       stroke="none"
       id="circle14" />
    <!-- Bottom wire -->
    <line
       x1="47.868462"
       y1="235.7607"
       x2="792.86847"
       y2="235.7607"
       id="line15" />
  </g>
  <!-- ================= LABELS ================= -->
  <g
